<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ganesha, in a Thousand Points of Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0912;
    --gold:#cf9f3f;
    --ink:#f3ece0;
    --ink-muted:#a89e8f;
    --border:rgba(207,159,63,0.35);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0912; } }
  :root[data-theme="dark"]{ --bg:#0b0912; }

  *{ box-sizing:border-box; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -5%, #241934 0%, var(--bg) 55%) fixed,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(18px,3vw,28px);
    padding-left:20px;
    padding-right:20px;
    padding-top:calc(env(safe-area-inset-top,0px) + 44px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);
  }
  header{ max-width:560px; text-align:center; }
  h1{
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    font-weight:600;
    font-size:clamp(30px,5vw,44px);
    line-height:1.14;
    margin:0 0 14px;
  }
  p.lede{
    margin:0;
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink-muted);
  }
  .frame{
    position:relative;
    padding:14px;
    border:1px solid var(--border);
    background:linear-gradient(180deg,#171122,#100c19);
    box-shadow:0 40px 90px -40px rgba(0,0,0,0.8);
  }
  .frame::before{
    content:"";
    position:absolute; inset:5px;
    border:1px solid rgba(207,159,63,0.16);
    pointer-events:none;
  }
  canvas{
    display:block;
    height:min(72vh,700px);
    max-height:78vh;
    width:auto;
    max-width:86vw;
  }
  footer{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  #status{
    font-size:13px;
    color:var(--ink-muted);
  }
  button{
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--border);
    padding:9px 20px;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  button:hover{ border-color:var(--gold); background:rgba(207,159,63,0.08); }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
</style>
</head>
<body>
  <header>
    <h1>Ganesha, in a Thousand Points of Light</h1>
    <p class="lede">Your photograph of the idol, rebuilt point by point — each raised, glowing dot sized by how much light it holds.</p>
  </header>

  <div class="frame">
    <canvas id="art" aria-label="Dot-art rendering of a Ganesha idol, built from small raised circles of colour"></canvas>
  </div>

  <footer>
    <span id="status">building…</span>
    <button id="replay" type="button">Watch it rise again</button>
  </footer>

    var octx = off.getContext('2d');
    octx.drawImage(img,0,0,W,H);
    var data = octx.getImageData(0,0,W,H).data;

    dots = [];
    var cols = Math.floor(W/SPACING), rows = Math.floor(H/SPACING);
    for(var ry=0; ry<rows; ry++){
      var y = ry*SPACING + SPACING/2;
      for(var rx=0; rx<cols; rx++){
        var x = rx*SPACING + SPACING/2;
        var idx = ((y|0)*W + (x|0)) * 4;
        var r=data[idx], g=data[idx+1], b=data[idx+2], a=data[idx+3];
        if(a<40) continue;
        var lum = luminance(r,g,b);
        if(lum < DARK_THRESHOLD) continue;
        var t = Math.min(1, lum/255);
        var radius = SPACING*(MIN_R + t*(MAX_R-MIN_R));
        dots.push({
          x:x, y:y, radius:radius,
          base:'rgb('+r+','+g+','+b+')',
          hi:shade(r,g,b,1.55),
          sh:shade(r,g,b,0.3),
          delay: reduceMotion ? 0 : (ry*6 + Math.random()*36)
        });
      }
    }
    statusEl.textContent = dots.length.toLocaleString() + ' dots, sized by light';
    startAnimation();
  }

  function frame(now){
    if(!animStart) animStart = now;
    var elapsed = now - animStart;
    ctx.clearRect(0,0,W,H);
    var allDone = true;
    for(var i=0;i<dots.length;i++){
      var d = dots[i];
      var p = (elapsed - d.delay)/DURATION;
      if(p<0){ allDone=false; continue; }
      if(p>1) p=1; else allDone=false;
      var e = easeOutBack(p);
      var rad = d.radius*e;
      if(rad<=0.1) continue;
      ctx.beginPath();
      ctx.fillStyle = d.sh;
      ctx.arc(d.x+1, d.y+1.4, rad, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = d.base;
      ctx.arc(d.x, d.y, rad, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = d.hi;
      ctx.globalAlpha = 0.5;
      ctx.arc(d.x - rad*0.32, d.y - rad*0.34, rad*0.36, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if(!allDone){
      rafId = requestAnimationFrame(frame);
    } else {
      rafId = null;
    }
  }

  function startAnimation(){
    if(rafId) cancelAnimationFrame(rafId);
    animStart = 0;
    rafId = requestAnimationFrame(frame);
  }

  var img = new Image();
  img.onload = function(){ build(img); };
  img.onerror = function(){ statusEl.textContent = 'image failed to load'; };
  img.src = IMG_SRC;

  replayBtn.addEventListener('click', startAnimation);
})();
</script>
</body>
</html>
